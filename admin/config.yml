backend:
  name: git-gateway
  branch: main # atau master (sesuai nama branch utama di GitHub Anda)

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Produk & Layanan"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nama Produk", name: "title", widget: "string" }
      - { label: "Harga / Keterangan", name: "price", widget: "string" }
      - { label: "Status Badge", name: "badge", widget: "select", options: ["Tersedia", "Incoming", "Pre-Order", "Habis"], default: "Tersedia" }
      - { label: "Foto Produk", name: "image", widget: "image" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }

  - name: "settings"
    label: "Pengaturan Website"
    files:
      - file: "content/settings.json"
        label: "Informasi Umum"
        name: "general"
        fields:
          - { label: "Nama Bisnis", name: "site_title", widget: "string", default: "Atuk Farm" }
          - { label: "Nomor WhatsApp (Contoh: 628123456789)", name: "whatsapp_number", widget: "string" }
          - { label: "Alamat Kandang", name: "address", widget: "text" }
